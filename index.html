 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keithel - Local Market</title>
    <style>

        :root {
            --bg-page: #ffffff;
            --bg-surface: #f5f5f7;
            --text-primary: #111827;
            --text-muted: #4b5563;
            --border-subtle: #e5e7eb;
        }

        [data-theme="dark"] {
            --bg-page: #0b0f17;
            --bg-surface: #141B29;
            --text-PRIMARY: #F9FAFB;
            --text-muted: #9ca3af;
            --border-subtle: #263146;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
        }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: #f6f7f9;
        color: #1f2937;
        line-height: 1.5;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }

      header {
        background-color: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background-color: #dc2626;
        color: #ffffff;
        font-weight: 700;
        font-size: 1.15rem;
        display: grid;
        place-items: center;
        text-transform: uppercase;
      }

      .brand-text h1,
      #shopName {
        font-size: 1.25rem;
        font-weight: 700;
        color: #111827;
      }

      #shopTagline {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .cart-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #111827;
        color: #ffffff;
        padding: 6px 6px 6px 14px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }

      #cartCount {
        background-color: #22c55e;
        color: #ffffff;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      main.wrap {
        padding-top: 20px;
        padding-bottom: 40px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        background-color: #ffffff;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        margin-bottom: 20px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 220px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 0 12px;
        background: #ffffff;
      }

      .search-box:focus-within {
        border-color: #16a34a;
      }

      .search-box svg {
        color: #6b7280;
        flex-shrink: 0;
      }

      .toolbar input[type="text"] {
        width: 100%;
        padding: 8px 0;
        border: none;
        font-size: 0.9rem;
        outline: none;
      }

      .toolbar button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background-color: #ffffff;
        color: #374151;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .toolbar button:hover,
      .toolbar button.active {
        background-color: #16a34a;
        border-color: #16a34a;
        color: #ffffff;
      }

      /* Stats Section Styling */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }

      .stat {
        background: #ffffff;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
      }

      .stat-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b7280;
        font-weight: 600;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #111827;
        margin-top: 4px;
      }

      /* Product Grid & Cards */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .product-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
      }

      .product-card h3 {
        font-size: 1.05rem;
        color: #111827;
        text-transform: capitalize;
      }

      .badge {
        display: inline-block;
        width: fit-content;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
        background: #f3f4f6;
        color: #4b5563;
        text-transform: capitalize;
      }

      .price {
        font-size: 1.15rem;
        font-weight: 700;
        color: #16a34a;
      }

      .stock-text {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .stock-out {
        color: #dc2626;
        font-weight: 600;
      }

      .product-card button {
        margin-top: 6px;
        padding: 9px 12px;
        border: none;
        border-radius: 8px;
        background-color: #16a34a;
        color: #ffffff;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .product-card button:hover:not(:disabled) {
        background-color: #15803d;
      }

      .product-card button:disabled {
        background-color: #d1d5db;
        color: #6b7280;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap header-inner">
        <div class="brand">
          <div class="brand-mark">k</div>
          <div class="brand-text">
            <h1 id="shopName">Keithel</h1>
            <p id="shopTagline">keithel Local Market</p>
          </div>
        </div>
        <div class="cart-pill">
          <span>Cart</span>
          <strong id="cartCount">0</strong>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="toolbar">
        <div class="search-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input type="text" id="searchInput" placeholder="Search products..." />
        </div>
        <button class="chip active" data-category="All">All</button>
        <button class="chip" data-category="Makeup">Makeup</button>
        <button class="chip" data-category="Skincare">Skincare</button>
        <button class="chip" data-category="Eye Makeup">Eye Makeup</button>
      </div>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">Products</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">In Stock</div>
          <div class="stat-value" id="statStock">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Inventory Value</div>
          <div class="stat-value" id="statValue">₹0</div>
        </div>
      </section>

      <section class="grid" id="productGrid"></section>
    </main>

    <script>
      const products = [
        { id: 1, name: "Lipstick", category: "Makeup", price: 450, stock: 15 },
        { id: 2, name: "Compact powder", category: "Makeup", price: 350, stock: 20 },
        { id: 3, name: "Liquid Foundation", category: "Makeup", price: 40, stock: 230 },
        { id: 4, name: "Waterproof Eyeliner", category: "Eye Makeup", price: 220, stock: 12 },
        { id: 5, name: "Moisturizing Face Cream", category: "Skincare", price: 465, stock: 10 },
        { id: 6, name: "Sunscreen SPF 50", category: "Skincare", price: 400, stock: 0 }
      ];

      let cartCount = 0;
      let currentCategory = "All";

      const searchInput = document.getElementById("searchInput");
      const chips = document.querySelectorAll(".chip");
      const statTotal = document.getElementById("statTotal");
      const statStock = document.getElementById("statStock");
      const statValue = document.getElementById("statValue");
      const productGrid = document.getElementById("productGrid");
      const cartCountEl = document.getElementById("cartCount");

      function updateCartDisplay() {
        if (cartCountEl) {
          cartCountEl.textContent = cartCount;
        }
      }

      function updateStats(list) {
        const totalProducts = list.length;
        const inStockCount = list.filter((p) => Number(p.stock) > 0).length;
        const inventoryValue = list.reduce(
          (sum, p) => sum + (Number(p.price) || 0) * (Number(p.stock) || 0),
          0
        );

        if (statTotal) statTotal.textContent = totalProducts;
        if (statStock) statStock.textContent = inStockCount;
        if (statValue) statValue.textContent = `₹${inventoryValue}`;
      }
       const THEME_KEY = "keithel_theme";
        const themeToggleBtn = document.querySelector("#theme-toggle");

        function applyTheme(theme) {
            const normalized = theme === "dark" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", normalized);
            localStorage.setItem(THEME_KEY, normalized);
            if (themeToggleBtn) {
                themeToggleBtn.setAttribute("aria-pressed", String(normalized === "dark"));
                themeToggleBtn.textContent = normalized === "dark" ? "Light Mode" : "Dark Mode";
            }
        }
        if (themeToggleBtn) {
        themeToggleBtn.addEventListener("click", () => {
            const current = document.documentElement.getAttribute("data-theme");
            applyTheme(current == "dark" ? "light" : "dark");
        });

        applyTheme(localStorage.getItem(THEME_KEY) || "light");
    };
    
      function renderProducts() {
        const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

        const filtered = products.filter((product) => {
          const matchesCategory =
            currentCategory.toLowerCase() === "all" ||
            product.category.toLowerCase() === currentCategory.toLowerCase();
          const matchesSearch = product.name.toLowerCase().includes(query);
          return matchesCategory && matchesSearch;
        });

        updateStats(filtered);

        if (!productGrid) return;
        productGrid.innerHTML = "";

        if (filtered.length === 0) {
          productGrid.innerHTML = "<p>Pot leiba leite (No products found).</p>";
          return;
        }

        filtered.forEach((product) => {
          const card = document.createElement("div");
          card.className = "product-card";

          card.innerHTML = `
            <div>
              <span class="badge">${product.category}</span>
              <h3 style="margin-top: 8px;">${product.name}</h3>
            </div>
            <div>
              <div class="price">₹${product.price}</div>
              <p class="stock-text ${product.stock === 0 ? "stock-out" : ""}">
                ${product.stock > 0 ? `${product.stock} available` : "Out of stock"}
              </p>
              <button style="width: 100%;" ${product.stock === 0 ? "disabled" : ""} onclick="addToCart(${product.id})">
                ${product.stock === 0 ? "Out of Stock" : "Add to Cart"}
              </button>
            </div>
          `;
          productGrid.appendChild(card);
        });
      }
      const cart_key = "keithel_cart";

function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function loadCart() {
    try {
        const raw = localStorage.getItem(CART_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch (err) {
        console.log("Failed to parse saved cart:", err);
        return [];
    }
    }
    const sort_key = "keithel_sort";
    const CATEGORY_KEY = "Keithel_category";

    function bindFilterListeners() {
        categorySelect.addEventlistener("change", (e) => {
            const selectedCategory = e.target.value;
            localStorage.setItem(CATEGORY_KEY, selectedCategory);
            applyFiltersAndRender();
        });

        sortSelect.addEvenlistener("change", (e) => {
            const selectedSort = e.target.value;
            localStorage.setItem(SORT_KEY, selectedSort);
            applyFiltersAndRender();
        });
    }

    async function loadproducts() {
        const savedCategory = localStorage.getItem(CATEGORY_KEY) || "all";
        const savedSort = localStorage.getItem(SORT_KEY) || "default";

        categorySelect.value = savedCategory;
        sortSelect.value = savedSort;

        const products = await fetchProductswithCache();
        state.products = products;
        applyFiltersAndRender();
    }

    const SAVED_KEY = "keithel_saved";
    let savedIds = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");

    function updateSavedBadge() {
        const badge = document.querySelector("#saved-count");
        if (badge) {
            badge.textContent = String(savedIds.length);
        }
    }

    function toggleSavedItem(productId) {
        const idStr = String(productId);
        if (savedIds.includes(idStr)) {
            savedIds = savedIds.filter((item) => item !== idStr);
        } else {
            savedIds.push(idStr);
        }
        localStorage.setItem(SAVED_KEY, JSON.stringify(savedIds));
        updateSavedBadge();
        renderProducts(state.filteredproducts);
    }

    

    const CACHE_KEY = "keithel_products_cache";
    const CACHE_MAX_AGE = 10_000;

    async function fetchProductswithCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                const age = Date.now() - parsed.timestamp;
                if (age < CACHE_MAX_AGE && Array.isArray(parsed.data)) {
                    console.log(`[Cache HIT] Using cached products (age: ${age}ms < ${CACHE_MAX_AGE}ms)`);
                    return parsed.data;
                }
                console.log(`[Cache EXPIRED] age ${age}ms reached limit (${CACHE_MAX_AGE}ms). fetching fresh data...`);
            } else {
                console.log("[Cache MISS] No cache entry found. Fetching fresh data...");
            }
           } catch (err) {
                console.warn("[Cache READ ERROR] Falling back to network fetch:", err);
            }

            const res = await fetch("./products.json");
            const data = await res.json();
            localStorage.setItem(
                CACHE_KEY,
                JSON.stringify({ timestamp: Date.now(), data })
            );
            console.log("[Network FETCH] fresh products loaded and cached.");
            return data;
        }

        function exportCart() {
            const cart = loadCart();
            const pretty = JSON.stringify(cart, null, 2);
            console.log("Exported Keithel Cart:\n", pretty);
            return pretty;
        }

        function importCart(jsonString) {
            try {
                const parsed = JSON.parse(jsonString);
                if (!Array.isArray(parsed)) {
                    throw new Error("Imported cart JSON must be an array.");
                }
                saveCart(parsed);
                renderCartDrawer(parsed);
                updateCartCountBadge(parsed);
                console.log("Cart imported successfully:", parsed);
                return true;
            } catch (err) {
              console.error("Invalid cart JSON - import aborted:", err.message);
              return false;
            }
        }
      window.addToCart = function (productId) {
        const item = products.find((p) => p.id === productId);
        if (item && item.stock > 0) {
          item.stock -= 1;
          cartCount += 1;
          updateCartDisplay();
          renderProducts();
        }
      };

      if (searchInput) {
        searchInput.addEventListener("input", renderProducts);
      }

      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          chips.forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          currentCategory = chip.textContent.trim();
          renderProducts();
        });
      });

      renderProducts();
    </script>
  </body>
</html>
